name: Email submitter when job is published

# When a job-submission pull request (branch job/*, opened by the job-submit
# Cloudflare Worker) is merged, look up the submitter's private email — stored
# in Cloudflare KV by the Worker, keyed by PR number — and notify them that
# their posting is live. The address is never committed to the repo or shown in
# the PR; it is fetched at merge time over an authenticated endpoint.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  notify:
    # Only fire on an actual merge of a job-submission branch.
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'job/')
    runs-on: ubuntu-latest
    steps:
      - name: Look up submitter email
        id: lookup
        env:
          LOOKUP_URL: ${{ secrets.JOB_LOOKUP_URL }}
          LOOKUP_SECRET: ${{ secrets.JOB_LOOKUP_SECRET }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$LOOKUP_URL" ] || [ -z "$LOOKUP_SECRET" ]; then
            echo "Lookup secrets not configured; skipping email."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          resp="$(curl -fsS -H "Authorization: Bearer ${LOOKUP_SECRET}" "${LOOKUP_URL}?pr=${PR_NUMBER}" || true)"
          found="$(printf '%s' "$resp" | jq -r '.found // false')"
          if [ "$found" != "true" ]; then
            echo "No email on file for PR #${PR_NUMBER}; nothing to send."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Strip CR/LF so an attacker-influenced title/email cannot inject extra
          # workflow outputs (GitHub Actions output-injection hardening).
          email="$(printf '%s' "$resp" | jq -r '.email' | tr -d '\r\n')"
          title="$(printf '%s' "$resp" | jq -r '.title // ""' | tr -d '\r\n')"
          {
            echo "found=true"
            echo "email=${email}"
            echo "title=${title}"
          } >> "$GITHUB_OUTPUT"

      - name: Send notification email
        if: steps.lookup.outputs.found == 'true'
        # Pinned to a full commit SHA (supply-chain hardening); comment records the version.
        uses: dawidd6/action-send-mail@42942bc2f8fba4e611b459a018967a6a7c78c68c # v17
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          # Set the SMTP_SECURE repo secret to "true" for implicit TLS (port 465).
          # Leave unset for STARTTLS (port 587, the common default).
          secure: ${{ secrets.SMTP_SECURE || 'false' }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          from: Open Source Design <${{ secrets.SMTP_FROM }}>
          to: ${{ steps.lookup.outputs.email }}
          subject: Your job posting is now live on Open Source Design
          body: |
            Hi,

            Good news — your job posting "${{ steps.lookup.outputs.title }}" has been
            reviewed and is now published on Open Source Design:

            https://opensourcedesign.net/jobs/

            Thanks for supporting open source design!

            — The Open Source Design community

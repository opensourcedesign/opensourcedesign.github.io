# WCAG 2 AA checks on a curated set of representative pages (not the full sitemap).
name: Accessibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.filter.outputs.site }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 2

      - name: Detect site-affecting changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: .github/path-filters.yml

  a11y:
    needs: changes
    if: needs.changes.outputs.site == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Hugo site build
        uses: ./.github/actions/setup-hugo-build
        with:
          install-pagefind: "false"

      - name: Build site
        run: hugo --minify --gc

      - name: Generate pa11y URL list
        run: node .github/scripts/generate-pa11yci-config.mjs

      - name: Install pa11y
        run: npm install --no-save pa11y@6 serve@14

      - name: Run accessibility checks
        run: |
          npx serve public -l 4321 &
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:4321/" >/dev/null; then
              break
            fi
            sleep 1
          done
          node .github/scripts/run-pa11y-batch.mjs

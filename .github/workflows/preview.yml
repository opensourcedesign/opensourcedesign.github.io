name: PR Preview

# pull_request_target runs in the base-repo context so GITHUB_TOKEN can push to
# gh-pages for fork PRs. Untrusted PR code only runs in build-preview (read-only
# token, no secrets); deploy-preview uploads the static artifact only.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Absolute origin used by Hugo when building preview URLs.
  PREVIEW_SITE_URL: https://opensourcedesign.net
  # Hostname used when composing PR preview comment links.
  PREVIEW_SITE_HOST: opensourcedesign.net

jobs:
  changes:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      site: ${{ steps.filter.outputs.site }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # Required for fork PRs under pull_request_target; build job has read-only token.
          allow-unsafe-pr-checkout: true

      - name: Detect site-affecting changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: .github/path-filters.yml
          base: ${{ github.event.pull_request.base.sha }}

  build-preview:
    needs: changes
    if: github.event.action != 'closed' && needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # Required for fork PRs under pull_request_target; deploy uses artifact only.
          allow-unsafe-pr-checkout: true

      - name: Setup Hugo site build
        uses: ./.github/actions/setup-hugo-build

      - name: Build site for preview
        run: bash .github/scripts/build-hugo-site.sh preview "${{ github.event.pull_request.number }}"

      - name: Upload preview artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-site
          path: public/
          retention-days: 1

  deploy-preview:
    needs: build-preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout base branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Deploy uses the artifact only; avoid fork PR checkout under pull_request_target.
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Download preview artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: preview-site
          path: public

      - name: Deploy PR preview to gh-pages
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          branch: gh-pages
          folder: ./public
          target-folder: pr-preview/pr-${{ github.event.pull_request.number }}
          commit-message: Deploy preview for PR ${{ github.event.pull_request.number }}

      - name: Comment PR preview link
        uses: marocchino/sticky-pull-request-comment@70d2764d1a7d5d9560b100cbea0077fc8f633987 # v3.0.2
        with:
          header: pr-preview
          message: |
            ## PR site preview

            **Preview this pull request:** https://${{ env.PREVIEW_SITE_HOST }}/pr-preview/pr-${{ github.event.pull_request.number }}/

      - name: Verify GitHub Pages source branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch=$(gh api "repos/${{ github.repository }}/pages" --jq '.source.branch')
          cname=$(gh api "repos/${{ github.repository }}/pages" --jq '.cname // empty')
          if [ "$branch" != "gh-pages" ]; then
            echo "::warning::GitHub Pages publishes from '$branch', but PR previews deploy to gh-pages. Previews will 404 at ${{ env.PREVIEW_SITE_URL }}/pr-preview/… until Settings → Pages → Deploy from branch → gh-pages (see docs/moderation-guide.md)."
          fi
          if [ "$cname" != "opensourcedesign.net" ]; then
            echo "::warning::Custom domain is '${cname:-not set}' (expected opensourcedesign.net). Previews may only work on github.io until the domain is verified and attached (see docs/moderation-guide.md)."
          fi

  skip-preview:
    needs: changes
    if: github.event.action != 'closed' && needs.changes.outputs.site != 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Note skipped preview
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const marker = '<!-- pr-preview-skipped -->';
            const body = `${marker}
            ℹ️ **PR preview skipped** — no site files changed in this pull request (e.g. README, \`docs/\`, or \`workers/\` only).

            Paths that trigger a Hugo build and preview are listed under \`site\` in [\`.github/path-filters.yml\`](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/.github/path-filters.yml).`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout base branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Cleanup only removes gh-pages preview; no fork PR code needed.
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Prepare empty preview directory
        run: mkdir -p empty-preview

      - name: Remove PR preview from gh-pages
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          branch: gh-pages
          folder: empty-preview
          target-folder: pr-preview/pr-${{ github.event.pull_request.number }}
          commit-message: Remove preview for PR ${{ github.event.pull_request.number }}
          clean: true

      - name: Note preview removed
        uses: marocchino/sticky-pull-request-comment@70d2764d1a7d5d9560b100cbea0077fc8f633987 # v3.0.2
        with:
          header: pr-preview
          message: |
            PR preview removed because the pull request was closed.

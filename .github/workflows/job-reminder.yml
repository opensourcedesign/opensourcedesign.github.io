# Ask posters of ~45-day-old open job postings whether they're still
# searching. Runs weekly; job-reminders.mjs selects `searching` postings
# whose date_posted falls in the 42-48 day window (so each job is caught
# exactly once), maps each file to its submission PR, and resolves the
# submitter's email from Cloudflare KV via the Worker's authenticated lookup
# (same mechanism as job-approved-email.yml). Manually committed postings
# have no stored email and are skipped.
name: Remind posters of ageing job posts

on:
  schedule:
    # Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install nodemailer
        run: npm install --no-save nodemailer@6.10.1

      - name: Send reminder emails
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LOOKUP_URL: ${{ secrets.JOB_LOOKUP_URL }}
          LOOKUP_SECRET: ${{ secrets.JOB_LOOKUP_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE || 'false' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: node .github/scripts/job-reminders.mjs

# Cache Discourse latest topics for Hugo builds (no build-time network call).
# The homepage still refreshes via the Worker /forum proxy in the browser.
name: Refresh forum pulse cache

on:
  schedule:
    - cron: "17 */12 * * *" # every 12 hours at :17
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forum-pulse-cache
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Fetch latest forum topics
        id: fetch
        env:
          FORUM_URL: https://discourse.opensourcedesign.net
        run: node .github/scripts/forum-pulse-cache.mjs

      - name: Commit cache update
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forum-pulse.json
          git commit -m "Refresh forum pulse cache"
          git push

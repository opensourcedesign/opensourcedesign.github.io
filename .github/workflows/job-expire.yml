# Auto-expire job postings (issue #84).
#
# Runs daily and flips `status: searching` to `status: expired` when either:
#   1. the posting's `deadline` (application deadline) has passed, or
#   2. the posting is older than a year with no update since
#      (most recent of `date_posted` / `last_updated`).
#
# Expired postings drop off /jobs/ and surface on /jobs/archive/ instead.
# `main` is protected (PRs required), so this workflow opens/updates a bot PR
# instead of pushing directly. Merging triggers hugo-build via the normal
# push-to-main hook.
name: Expire stale job postings

on:
  schedule:
    - cron: "15 4 * * *" # daily at 04:15 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would expire without committing"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: job-expire
  cancel-in-progress: false

jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (supply-chain hardening).
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Expire postings past their deadline or older than a year
        id: expire
        env:
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
        run: node .github/scripts/job-expire.mjs

      - name: Open pull request
        if: steps.expire.outputs.count != '0' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="bot/auto-expire-jobs"
          count="${{ steps.expire.outputs.count }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add content/jobs
          git commit -m "Auto-expire ${count} job posting(s) past deadline or older than a year"
          git push --force-with-lease origin "$branch"
          body="$(cat <<EOF
          Scheduled [\`job-expire\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) flipped **${count}** posting(s) from \`searching\` to \`expired\`.

          See the workflow summary for the file list. Merge when ready; \`main\` deploy runs automatically on merge.
          EOF
          )"
          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number' || true)"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" \
              --title "Auto-expire ${count} job posting(s)" \
              --body "$body"
            echo "Updated open PR #${existing}"
          else
            gh pr create --base main --head "$branch" \
              --title "Auto-expire ${count} job posting(s)" \
              --body "$body"
          fi

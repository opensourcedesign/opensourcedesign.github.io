name: Build and Deploy Hugo

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.163.2
  # Pagefind is a standalone Rust binary downloaded straight from GitHub
  # releases — no npm involved. Update the version and checksum together
  # (checksum from the .tar.gz.sha256 asset on the release page).
  PAGEFIND_VERSION: 1.5.2
  PAGEFIND_SHA256: afb824a9e7f64905a934900481cea5be679c03975e527329e0e5e6cc70f5feda

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (supply-chain hardening).
      # The trailing comment records the human-readable version.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      # Cache Hugo's processed asset derivatives (resized images, AVIF/WebP
      # encodes). This skips expensive re-encoding when the source images and
      # image templates are unchanged, keeping builds fast.
      - name: Cache Hugo resources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: resources/_gen
          key: hugo-resources-${{ hashFiles('assets/**', 'hugo.toml', 'layouts/partials/resolve-image.html', 'layouts/_default/_markup/render-image.html') }}
          restore-keys: |
            hugo-resources-

      # No CSS build step: Tailwind runs in the browser via the Play CDN and
      # the typography bundle is checked in (issue #556). The Pagefind search
      # indexer is fetched as a prebuilt binary, so no Node/npm is needed.
      - name: Install Pagefind
        run: |
          curl -fsSL -o pagefind.tar.gz \
            "https://github.com/Pagefind/pagefind/releases/download/v${PAGEFIND_VERSION}/pagefind-v${PAGEFIND_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${PAGEFIND_SHA256}  pagefind.tar.gz" | sha256sum --check
          tar -xzf pagefind.tar.gz
          rm pagefind.tar.gz
          chmod +x pagefind

      - name: Build site
        run: hugo --minify --gc

      - name: Build search index (Pagefind)
        run: ./pagefind --site public

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          # Mirror the build output exactly. The site is fully generated by Hugo
          # (CNAME comes from static/, .nojekyll is added automatically), so
          # keeping old files would leave renamed/removed pages live as stale
          # duplicates — bad for SEO. A clean mirror removes orphaned URLs.
          keep_files: false

name: Link check

on:
  schedule:
    # Approximately every 14 days (1st and 15th of each month, 06:47 UTC).
    - cron: "47 6 1,15 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (supply-chain hardening).
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Hugo site build
        uses: ./.github/actions/setup-hugo-build

      # Match hugo-build.yml so Lychee scans the same HTML as production.
      - name: Refresh forum pulse cache
        env:
          FORUM_URL: https://discourse.opensourcedesign.net
        run: node .github/scripts/forum-pulse-cache.mjs

      - name: Build site
        run: bash .github/scripts/build-hugo-site.sh production

      # Internal links are checked offline against the built tree; external
      # links are limited so the run stays polite and flake-resistant.
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --root-dir "$(pwd)/public"
            --base-url https://opensourcedesign.net
            --accept 200..=299,403,429
            --max-concurrency 8
            --timeout 20
            --exclude-path public/archive
            --exclude "^https://(www\.)?(twitter|x)\.com"
            --exclude "^https://(www\.)?linkedin\.com"
            --exclude "^mailto:"
            --format json
            public
          fail: false
          output: lychee-results.json

      - name: Update broken-links tracker issue
        if: always() && steps.lychee.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LYCHEE_JSON: lychee-results.json
        run: node .github/scripts/link-check-issue.mjs

name: Link check

on:
  schedule:
    # Weekly, Monday 06:47 UTC (off the :00 rush).
    - cron: "47 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  HUGO_VERSION: 0.164.0

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (supply-chain hardening).
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build site
        run: hugo --minify --gc

      # Internal links are checked offline against the built tree; external
      # links are limited so the run stays polite and flake-resistant.
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --root-dir "$(pwd)/public"
            --base-url https://opensourcedesign.net
            --accept 200..=299,403,429
            --max-concurrency 8
            --timeout 20
            --exclude-path public/archive
            --exclude "^https://(www\.)?(twitter|x)\.com"
            --exclude "^https://(www\.)?linkedin\.com"
            --exclude "^mailto:"
            public
          fail: false
          output: lychee-report.md

      - name: Open or update the broken-links issue
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6
        with:
          title: "Broken links found by the weekly link check"
          content-filepath: lychee-report.md
          labels: link-check, maintenance

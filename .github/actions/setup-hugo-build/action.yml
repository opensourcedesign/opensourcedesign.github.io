name: Setup Hugo site build
description: Load CI version pins, Hugo, resource cache, Node, Tailwind, and optional Pagefind.
inputs:
  install-pagefind:
    description: Download and verify the Pagefind binary
    required: false
    default: "true"
  cache-resources:
    description: Restore Hugo processed-asset cache
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Load CI version pins
      uses: ../load-ci-versions

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
      with:
        hugo-version: ${{ env.HUGO_VERSION }}
        extended: true

    - name: Cache Hugo resources
      if: inputs.cache-resources == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: resources/_gen
        key: hugo-resources-${{ hashFiles('assets/**', 'hugo.toml', 'layouts/partials/resolve-image.html', 'layouts/_default/_markup/render-image.html') }}
        restore-keys: |
          hugo-resources-

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install build tools
      shell: bash
      env:
        INSTALL_PAGEFIND: ${{ inputs.install-pagefind }}
      run: bash .github/scripts/ci-install-build-tools.sh
